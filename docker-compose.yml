services:
  freetuve:
    build: .
    ports:
      - "8000:8000"
    environment:
      FREETUVE_LESSON_TTL_HOURS: ${FREETUVE_LESSON_TTL_HOURS:-24}
      FREETUVE_MAX_VIDEO_SECONDS: ${FREETUVE_MAX_VIDEO_SECONDS:-3600}
      FREETUVE_MAX_MEDIA_MB: ${FREETUVE_MAX_MEDIA_MB:-250}
      FREETUVE_CREATE_LIMIT_PER_HOUR: ${FREETUVE_CREATE_LIMIT_PER_HOUR:-10}
      FREETUVE_WHISPER_MODEL: ${FREETUVE_WHISPER_MODEL:-small}
      FREETUVE_WHISPER_DEVICE: ${FREETUVE_WHISPER_DEVICE:-cpu}
      FREETUVE_WHISPER_COMPUTE_TYPE: ${FREETUVE_WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
