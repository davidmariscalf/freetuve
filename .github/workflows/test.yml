name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall app
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/sw.js
      - name: Validate PWA manifest
        run: python -m json.tool frontend/manifest.webmanifest > /dev/null
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Build production Docker image
        run: docker build -t freetuve-ci .
      - name: Smoke test production image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name freetuve-ci-run -p 18000:8000 freetuve-ci
          for i in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:18000/api/health > health.json; then break; fi
            sleep 1
          done
          test -s health.json
          cat health.json
          python -c 'import json; d=json.load(open("health.json")); assert d["ok"] and d["ffmpeg"] and d["local_transcription"] and d["multiplatform"]'
      - name: Clean up production container
        if: always()
        run: docker rm -f freetuve-ci-run >/dev/null 2>&1 || true
      - name: Upload Netlify source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netlify-source
          path: |
            netlify.toml
            frontend
            scripts/netlify_build.py
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log
          path: pytest.log
